<header>
  <div class="container">
    <div class="logo" (click)="logoClick()">
      <!-- <h1>RADHARANI<span>PROPERTIES</span></h1> -->
      <img src="../../assets/logo/mainlogo.png" alt="">
    </div>

    <!-- Mobile Menu Button -->
    <div class="mobile-menu-btn" (click)="toggleMenu()">
      <i class="fas fa-bars" *ngIf="!isMenuOpen"></i>
      <i class="fas fa-times" *ngIf="isMenuOpen"></i>
    </div>

    <!-- Navigation -->
    <nav [class.open]="!isMenuOpen">
      <ul>
        <li><a href="#home" (click)="closeMenu()">Home</a></li>
        <li><a href="#about" (click)="closeMenu()">About Us</a></li>
        <li><a href="#why-choose-us" (click)="closeMenu()">Why Choose Us</a></li>
        <li><a [routerLink]="['/properties']" (click)="closeMenu()">Projects</a></li>
        <li><a href="#contact" (click)="closeMenu()">Contact</a></li>
      </ul>
    </nav>

  </div>


</header>
