<div class="row">
  <div class="col-lg-6 mb-4">
    <div class="chart">
      <h3>Views per Day</h3>
      <canvas baseChart [type]="'line'" [data]="perDayChartData" [options]="chartOptions">
      </canvas>
    </div>
  </div>

  <div class="col-lg-6 mb-4">
    <div class="chart">
      <h3>Inquiries per Month</h3>
      <canvas baseChart [type]="'line'" [data]="perMonthChartData" [options]="chartOptions">
      </canvas>
    </div>
  </div>
</div>
